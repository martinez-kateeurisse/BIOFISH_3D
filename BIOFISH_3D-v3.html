<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIO-FISH 3D Model</title>
<style>
  * { margin:0; box-sizing:border-box; font-family:sans-serif; }
  body { background:#fff; }
  #tb {
    display:flex; flex-wrap:wrap; gap:5px; padding:8px 10px;
    background:#e4e4e0; border-bottom:1px solid #ccc; align-items:center;
  }
  .b {
    background:#fff; border:1px solid #bbb; border-radius:5px;
    padding:4px 10px; font-size:12px; cursor:pointer; color:#333;
  }
  .b:hover { background:#eee; }
  .b.on { background:#cce4ff; border-color:#66aadd; }
  .sep { width:1px; height:16px; background:#ccc; margin:0 3px; }
  #cw { position:relative; height:calc(100vh - 46px); }
  canvas { width:100%; height:100%; display:block; cursor:grab; }
  #ht {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.15); color:#333; font-size:11px;
    padding:4px 14px; border-radius:12px; pointer-events:none;
  }
  #ld {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#fff;
    font-size:15px; color:#555; gap:12px;
  }
  #lbar { width:220px; height:5px; background:#ddd; border-radius:3px; }
  #lp   { width:0%; height:100%; background:#5599dd; border-radius:3px; transition:width .25s; }
</style>
</head>
<body>

<div id="tb">
  <span style="font-size:12px;color:#888;margin-right:2px">View:</span>
  <button class="b on" onclick="sv('iso',this)">Iso</button>
  <button class="b" onclick="sv('front',this)">Front</button>
  <button class="b" onclick="sv('back',this)">Back</button>
  <button class="b" onclick="sv('left',this)">Left</button>
  <button class="b" onclick="sv('right',this)">Right</button>
  <button class="b" onclick="sv('top',this)">Top</button>
  <span class="sep"></span>
  <button class="b" id="bF" onclick="tg('f')">🚪 Front: Closed</button>
  <button class="b" id="bB" onclick="tg('b')">🚪 Back: Closed</button>
  <button class="b" id="bC" onclick="tg('c')">📟 Circuit: Closed</button>
  <button class="b" id="bP" onclick="tg('p')">📦 Platform: Folded</button>
  <span class="sep"></span>
  <button class="b on" id="bSh" onclick="tgShadow(this)">🌑 Shadow: On</button>
  <button class="b" id="bDemo" onclick="toggleDemo()">▶ Demo</button>
  <button class="b" id="bDm" onclick="tgDim(this)">📐 Dims: Off</button>
</div>

<div id="cw">
  <canvas id="c"></canvas>
  <div id="ht">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  <div id="ld">
    <div>Loading 3D engine…</div>
    <div id="lbar"><div id="lp"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var lp = document.getElementById('lp');
var pct = 0;
var pi = setInterval(function(){
  pct = Math.min(pct+10, 90);
  lp.style.width = pct+'%';
},100);
window.addEventListener('load', function(){
  clearInterval(pi); lp.style.width='100%';
  setTimeout(function(){ document.getElementById('ld').style.display='none'; build(); },150);
});

function build(){
  var R = THREE;
  var cv = document.getElementById('c');
  var ren = new R.WebGLRenderer({canvas:cv, antialias:true});
  ren.setPixelRatio(Math.min(devicePixelRatio,2));
  ren.setClearColor(0xffffff); 
  ren.shadowMap.enabled = true;
  ren.shadowMap.type = R.PCFSoftShadowMap;

  var scene = new R.Scene();
  scene.background = new R.Color(0xffffff); 
  scene.fog = new R.Fog(0xffffff, 400, 700); 

  var cam = new R.PerspectiveCamera(38, 1, 0.1, 1000);
  function resize(){
    var w=cv.clientWidth, h=cv.clientHeight;
    ren.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  }
  resize(); window.addEventListener('resize', resize);

  // ── LIGHTING ──
  scene.add(new R.AmbientLight(0xffffff, 0.70));
  var sun = new R.DirectionalLight(0xffffff, 0.6);
  sun.position.set(160,240,190);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left   = -100; sun.shadow.camera.right = 100;
  sun.shadow.camera.top    =  100; sun.shadow.camera.bottom=-100;
  sun.shadow.camera.near   = 0.5;  sun.shadow.camera.far   = 600;
  scene.add(sun);
  var f1=new R.DirectionalLight(0xeef2ff,0.30); f1.position.set(-120,80,-100); scene.add(f1);
  var f2=new R.DirectionalLight(0xffffff,0.20); f2.position.set(0,50,200);     scene.add(f2);
  var f3=new R.DirectionalLight(0xffffff,0.20); f3.position.set(0,-80,100);    scene.add(f3);

  var floor=new R.Mesh(new R.PlaneGeometry(400,400),
    new R.MeshStandardMaterial({color:0xd8d8d4,roughness:0.9}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-36;
  floor.receiveShadow=true; scene.add(floor);

  // ══════════════════════════════════════════════════════════════
  //  UNIFIED MATERIAL PALETTE  (consistent shading throughout)
  // ══════════════════════════════════════════════════════════════
  function mat(c,me,ro){
    return new R.MeshStandardMaterial({color:c, metalness:me, roughness:ro});
  }

  // Primary surfaces
  var mBody  = mat(0xbec0c3, 0.38, 0.52);  
  var mFrame = mat(0xa4a7ab, 0.50, 0.50);  
  var mDark  = mat(0x0e1012, 0.15, 0.85);  

  // Screen & indicators
  var mLCD   = new R.MeshStandardMaterial({color:0x1a55dd, emissive:0x06102a, roughness:0.40});

  // Switch
  var mSwWht = new R.MeshStandardMaterial({color:0xf0f0ee, roughness:0.78});
  var mSwRed = new R.MeshStandardMaterial({color:0xcc2200, roughness:0.80, emissive:0x220000});

  // Caster wheels
  var mWheel = new R.MeshStandardMaterial({color:0xcc1400, roughness:0.80, metalness:0.10});
  var mHub   = mat(0x828487, 0.30, 0.75);  

  // Mechanical / thermal components
  var mStove  = mat(0x8c8f92, 0.22, 0.80); 
  var mBurner = mat(0x1e2022, 0.28, 0.80); 
  var mPCB    = new R.MeshStandardMaterial({color:0x1b5e20, roughness:0.8, metalness:0.1});

  // Funnel
  var mFunnel = new R.MeshStandardMaterial({
    color:0xc8cacc, metalness:0.60, roughness:0.40, side:R.DoubleSide
  });

  var root=new R.Group(); scene.add(root);

  function bx(w,h,d,m,x,y,z,g){
    var me=new R.Mesh(new R.BoxGeometry(w,h,d),m);
    me.position.set(x,y,z); me.castShadow=true; me.receiveShadow=true;
    (g||root).add(me); return me;
  }
  function cy(rt,rb,h,sg,m,x,y,z,rx,rz,g){
    var me=new R.Mesh(new R.CylinderGeometry(rt,rb,h,sg||32),m);
    me.position.set(x,y,z);
    if(rx!=null) me.rotation.x=rx;
    if(rz!=null) me.rotation.z=rz;
    me.castShadow=true; (g||root).add(me); return me;
  }

  // ═══════════════════════════════════════════════════════════
  //  DIMENSIONS
  // ═══════════════════════════════════════════════════════════
  var W=86, H=51, D=40.5, T=0.5, PH=12.5, FT=2.5, WR=2.5;
  var BY=-H/2, TY=H/2;
  var DH=H-PH-FT*2;
  var divY=TY-PH-FT;

  var B1W=28.5, B2W=29, B3W=28.5;
  var B1X=-W/2+B1W/2+1.5;
  var B2X=-W/2+B1W+B2W/2;
  var B3X= W/2-B3W/2-1.5;
  var D1X=-W/2+B1W;
  var D2X= W/2-B3W;

  var CH=20, CR=10, CCR=10.5;
  var stoveFloor = BY+T;
  var stoveTopY  = stoveFloor+1+4;
  var tb13 = stoveTopY+CH/2+1;
  var tb2  = stoveFloor+CH/2+1;

  var cr=[
    [-W/2+FT/2,-D/2+FT/2],[W/2-FT/2,-D/2+FT/2],
    [-W/2+FT/2, D/2-FT/2],[W/2-FT/2, D/2-FT/2]
  ];
  var FZ= D/2-FT-T/2;
  var BZ=-D/2+FT+T/2;
  var PY2=TY-(PH+FT)/2;

  // ── FRAME ──
  cr.forEach(function(c){ bx(FT,H,FT,mFrame,c[0],0,c[1]); });
  [TY-FT/2, TY-PH-FT/2, BY+FT/2].forEach(function(y){
    bx(W,FT,FT,mFrame,0,y,-D/2+FT/2); bx(W,FT,FT,mFrame,0,y,D/2-FT/2);
    bx(FT,FT,D,mFrame,-W/2+FT/2,y,0); bx(FT,FT,D,mFrame,W/2-FT/2,y,0);
  });

  // ── SHELL ──
  bx(W-FT*2,T,D-FT*2,mBody,0,TY-T/2,0);   
  bx(W-FT*2,T,D-FT*2,mBody,0,BY+T/2,0);   

  // ── SIDE WALLS ──
  var vBase=BY+H*0.18, sLen=7.5, sR=0.5, sGap=3.0;
  var wY0=BY+FT, wY1=TY-FT, wZ0=-D/2+FT, wZ1=D/2-FT;
  function makeWall(mx,vZ){
    var sh=new R.Shape();
    sh.moveTo(wZ0,wY0); sh.lineTo(wZ1,wY0);
    sh.lineTo(wZ1,wY1); sh.lineTo(wZ0,wY1); sh.closePath();
    for(var i=0;i<3;i++){
      var cy2=vBase+i*sGap, zc=vZ, h2=new R.Path();
      h2.moveTo(zc-sLen/2,cy2-sR); h2.lineTo(zc+sLen/2,cy2-sR);
      h2.absarc(zc+sLen/2,cy2,sR,-Math.PI/2,Math.PI/2,false);
      h2.lineTo(zc-sLen/2,cy2+sR);
      h2.absarc(zc-sLen/2,cy2,sR,Math.PI/2,-Math.PI/2,false);
      h2.closePath(); sh.holes.push(h2);
    }
    var geo=new R.ExtrudeGeometry(sh,{depth:T,bevelEnabled:false});
    var mesh=new R.Mesh(geo,mBody);
    mesh.rotation.y=Math.PI/2;
    var xp=mx*(W/2-FT); mesh.position.set(xp-mx*T,0,0);
    if(mx<0) mesh.scale.x=-1;
    mesh.castShadow=true; mesh.receiveShadow=true; root.add(mesh);
  }
  makeWall( 1,  D/5);
  makeWall(-1, -D/5);

  // Interior front wall
  bx(W-FT*2,DH,T,mBody,0,BY+FT+DH/2,FZ-T);

  // ── FRONT PANEL STRIP ──
  bx(W-FT*2,PH-FT,T,mBody,0,PY2,FZ);
  bx(W-FT*2-2,PH-FT-2,0.3,mBody,0,PY2,FZ+0.3);

  // LCD
  var lx=-W/2+FT+8;
  bx(10,4,0.5,mDark,lx,PY2,FZ+0.3);
  bx(8.5,3,0.5,mLCD,lx,PY2,FZ+0.6);

  // Buttons
  for(var i=2;i<4;i++){
    var bxi=-24.5+i*4;
    cy(1.0,1.1,1.2,20,mDark,  bxi,PY2,FZ+0.5, Math.PI/2,null);
    cy(0.85,0.95,1.6,20,mFrame,bxi,PY2,FZ+1.4, Math.PI/2,null);
  }

  // ── BIOFISH LABEL PLATE ──
  var _lc=document.createElement('canvas');
  _lc.width=256; _lc.height=80;
  var _cx=_lc.getContext('2d');
  _cx.fillStyle='#c2c4c8';
  _cx.fillRect(0,0,256,80);
  _cx.font='bold 46px Arial';
  _cx.fillStyle='#1a55dd';
  _cx.textAlign='center';
  _cx.textBaseline='middle';
  _cx.fillText('BIOFISH',128,40);
  var _lt=new R.CanvasTexture(_lc);
  var mLabelFace=new R.MeshStandardMaterial({map:_lt,roughness:0.50,metalness:0.10});
  var mPlate=mat(0xc6c8cc,0.22,0.62);
  var _pg=new R.BoxGeometry(8.5,3.2,0.5);
  var _pm=new R.Mesh(_pg,[mPlate,mPlate,mPlate,mPlate,mLabelFace,mPlate]);
  _pm.position.set(-22.5,PY2,FZ+0.45);
  _pm.castShadow=true; root.add(_pm);

  // ── FRONT DOOR ──
  var fHY=BY+FT;
  var fDG=new R.Group(); fDG.position.set(0,fHY,FZ); root.add(fDG);
  bx(W-FT*2,DH,T,mBody,0,DH/2,0,fDG);

  // Hose dispensing hole
  var intWZ=D/2-FT-T*4;
  cy(0.5,0.5,2.5,12,mDark, B2X,BY+FT+DH*0.09,intWZ-1,   Math.PI/2,null);
  cy(1.0,1.0,1.2,16,mBody, B2X,BY+FT+DH*0.09,intWZ-1.8, Math.PI/2,null);

  // ── SUPPORT CHAINS ──
  var mChain=new R.MeshStandardMaterial({color:0xb8b8b8,metalness:0.80,roughness:0.20});
  var nLk=20, lkR=0.5, lkTR=0.13, lkSp=lkR*1.95;
  var natLen=nLk*lkSp;

  function mkChain(){
    var g=new R.Group();
    for(var i=0;i<nLk;i++){
      var t=new R.Mesh(new R.TorusGeometry(lkR,lkTR,6,8),mChain);
      t.position.y=(i-nLk/2+0.5)*lkSp;
      if(i%2===1) t.rotation.y=Math.PI/2;
      g.add(t);
    }
    g.visible=false; root.add(g); return g;
  }
  var chainL=mkChain(), chainR=mkChain();

  var cAncX =W/2-FT;
  var cDoorY=DH*1;
  var cFrmY =fHY+cDoorY;

  bx(2.2,2.2,1.4,mFrame,-cAncX,cFrmY,FZ+0.7);
  bx(2.2,2.2,1.4,mFrame, cAncX,cFrmY,FZ+0.7);
  bx(2.2,2.2,1.4,mFrame,-cAncX,cDoorY,0.7, fDG);
  bx(2.2,2.2,1.4,mFrame, cAncX,cDoorY,0.7, fDG);

  var _dir=new R.Vector3(), _yUp=new R.Vector3(0,1,0), _qq=new R.Quaternion();
  function updateChain(ch,ax,ay,az,bx2,by2,bz2){
    var dx=bx2-ax,dy=by2-ay,dz=bz2-az;
    var len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(len<2.0){ ch.visible=false; return; }
    ch.visible=true;
    ch.position.set((ax+bx2)/2,(ay+by2)/2,(az+bz2)/2);
    _dir.set(dx,dy,dz).normalize();
    _qq.setFromUnitVectors(_yUp,_dir);
    ch.quaternion.copy(_qq);
    ch.scale.y=len/natLen;
  }

  // ── BACK UPPER SECTION ──
  var HW=W/2-FT;
  bx(HW,PH-FT,T,mBody,HW/2,PY2,BZ);
  bx(0.8,PH-FT,0.8,mFrame,0,PY2,BZ-0.4);

  var cbHY=TY-PH;
  var cbG=new R.Group(); cbG.position.set(-HW/2,cbHY,BZ); root.add(cbG);
  bx(HW,PH-FT,T,mBody,0,(PH-FT)/2,0,cbG);
  cy(0.65,0.65,0.8,12,mFrame,0,(PH-FT)*0.55,-0.4,Math.PI/2,null,cbG);

  // Circuit board
  var pcbCX=-HW/2;
  var pcbY=divY+T+1.5;
  bx(21,T*2,D-FT*4-2,mPCB,pcbCX,pcbY,0);
  [[-5,3],[0,-4],[5,3]].forEach(function(c){
    bx(3.0,1.5,2.0,mDark,pcbCX+c[0],pcbY+T+0.75,c[1]);
  });

  // ── BACK DOUBLE DOORS ──
  var bDY=BY+FT, bdw=HW, fanR=3.5;
  function mkBackDoor(side){
    var g=new R.Group();
    g.position.set(side*(W/2-FT),bDY,BZ);
    root.add(g);
    var dc=side*(-bdw/2);
    bx(bdw,DH,T,mBody,dc,DH/2,0,g);
    var innerX=dc+(-side)*(bdw/2-0.4);
    bx(0.8,DH,0.6,mFrame,innerX,DH/2,-0.3,g);
    var fx=-side*(fanR+3.5), fy=DH*0.28;
    cy(fanR+0.5,fanR+0.5,T,   28,mBody,fx,fy,0.15, Math.PI/2,null,g);
    cy(fanR,fanR,T*1.5,        28,mDark,fx,fy,0,    Math.PI/2,null,g);
    cy(1.0,1.0,T+0.5,          12,mHub, fx,fy,0,    Math.PI/2,null,g);
    var hx=dc+(-side)*(bdw/2-2);
    bx(1.8,1.2,1.5,mFrame,hx,DH*0.5,-(T/2+0.75),g);
    return g;
  }
  var bDLG=mkBackDoor(-1), bDRG=mkBackDoor(1);

  // ── STOVE ──
  [B1X,B3X].forEach(function(sx){
    [[-8,-8],[-8,8],[8,-8],[8,8]].forEach(function(lp2){
      bx(1.5,1,1.5,mFrame,sx+lp2[0],stoveFloor+0.5,lp2[1]);
    });
    bx(21,4,21,mStove,sx,stoveFloor+1+2,0);
    [-5,5].forEach(function(boff){
      var ring=new R.Mesh(new R.TorusGeometry(2.5,0.55,8,24),mBurner);
      ring.rotation.x=Math.PI/2;
      ring.position.set(sx+boff,stoveFloor+5.1,0);
      root.add(ring);
    });
  });

  // ── CONTAINERS ×3 ──
  [[B1X,tb13],[B2X,tb2],[B3X,tb13]].forEach(function(p){
    var tx=p[0], tb=p[1];
    cy(CR,CR,CH,32,mBody,tx,tb,0);
    cy(CR+0.8,CR+0.8,1.0,32,mBody,tx,tb-CH/2-0.5,0);
    cy(CCR,CCR,1.5,32,mBody,tx,tb+CH/2+0.75,0);
    cy(1.1,1.1,2.0,16,mFrame,tx,tb+CH/2+2.0,0);
    bx(4,0.7,0.9,mFrame,tx,tb+CH/2+3.5,0);
  });

  // Bay divider panels
  bx(T*2,DH-2,D-FT*4,mBody,D1X,bDY+(DH-2)/2,0);
  bx(T*2,DH-2,D-FT*4,mBody,D2X,bDY+(DH-2)/2,0);

  // Upper / lower divider sheet
  bx(W-FT*2,T*2,D-FT*2,mBody,0,divY,0);

  // ── ROCKER SWITCH ──
  var swX = -(W/2-FT) - 1.5/2;
  var swY = TY-PH/2;
  var swZ = -D/2+FT+8;
  bx(1.5, 2.3, 3.0, mSwWht, swX, swY, swZ);
  bx(1.2, 1.4, 2.2, mSwWht, swX, swY, swZ);
  bx(1.5, 0.8, 0.8, mSwRed, swX, swY+0.5, swZ-0.7);

  // Side ports
  cy(0.5,0.5,T+2,14,mDark,-W/2+FT/2,BY+H*0.42, D/5,null,Math.PI/2);
  cy(1.0,1.0,T+1,16,mBody,-W/2+FT/2,BY+H*0.42, D/5,null,Math.PI/2);
  cy(0.5,0.5,T+2,14,mDark, W/2-FT/2,BY+H*0.42, D/5,null,Math.PI/2);
  cy(1.0,1.0,T+1,16,mBody, W/2-FT/2,BY+H*0.42, D/5,null,Math.PI/2);

  // ── FOLDING SIDE PLATFORMS ──
  // 5" × 5" × 1"  ≈  12.7 × 12.7 × 2.54 cm
  var PW=12.7, PD=12.7, PT=2.54;
  var SH=5.08, SW=2.54, BT=0.4, BH=2.54;
  var groundY = BY - 2*WR - 2;
  var pHingeY = groundY + PT + SH;
  var pHingeZ = D/5;

  // Left platform  (hinge at left wall, platform extends in -X when open)
  var platLG = new R.Group();
  platLG.position.set(-W/2, pHingeY, pHingeZ);
  root.add(platLG);
  cy(0.55,0.55,2.8,8,mHub, 0,0,-PD*0.28, Math.PI/2,null,platLG);
  cy(0.55,0.55,2.8,8,mHub, 0,0, PD*0.28, Math.PI/2,null,platLG);
  (function(){
    var inch=2.54, hW=(PW-3*inch)/2, hH=PD-2*inch;
    var sh=new R.Shape();
    sh.moveTo(-PW/2,-PD/2); sh.lineTo(PW/2,-PD/2);
    sh.lineTo(PW/2,PD/2);   sh.lineTo(-PW/2,PD/2); sh.closePath();
    [[-PW/2+inch,-PW/2+inch+hW],[-PW/2+2*inch+hW,-PW/2+2*inch+2*hW]].forEach(function(xr){
      var h=new R.Path();
      h.moveTo(xr[0],-hH/2); h.lineTo(xr[1],-hH/2);
      h.lineTo(xr[1], hH/2); h.lineTo(xr[0], hH/2); h.closePath();
      sh.holes.push(h);
    });
    var me=new R.Mesh(new R.ExtrudeGeometry(sh,{depth:PT,bevelEnabled:false}),mFrame);
    me.rotation.x=Math.PI/2; me.position.set(-PW/2,0,0);
    me.castShadow=true; platLG.add(me);
  })();
  platLG.rotation.z = -Math.PI/2;   // start folded
  var standCY = -PT - SH/2;
  bx(BT,BH,PD,  mFrame,-PW+BT/2,  BH/2, 0,        platLG);
  bx(PW,BH,BT,  mFrame,-PW/2,     BH/2, PD/2-BT/2, platLG);
  bx(PW,BH,BT,  mFrame,-PW/2,     BH/2,-PD/2+BT/2, platLG);
  bx(SW,SH,SW,  mFrame,-PW+SW/2, standCY, 0,       platLG);
  bx(SW+0.4,2.54,SW+0.4, mDark,-PW+SW/2,-PT-SH+1.27, 0, platLG);

  // Right platform (hinge at right wall, platform extends in +X when open)
  var platRG = new R.Group();
  platRG.position.set(W/2, pHingeY, pHingeZ);

    _DS(g,'Rim = 2.54 cm',rX2,(_plYtop2+_plYrim2)/2,_fZ4-11,11);
  })(dimGroups.right);

  // ── TOP ──
  (function(g){
    var tYY=TY+2;
    var wZ2=D/2+_o;
    _DL(g,[[-W/2,TY,D/2],[-W/2,tYY,wZ2]],1); _DL(g,[[W/2,TY,D/2],[W/2,tYY,wZ2]],1);
    _DL(g,[[-W/2,tYY,wZ2],[W/2,tYY,wZ2]]);
    _DT(g,-W/2,tYY,wZ2,1,0,0); _DT(g,W/2,tYY,wZ2,1,0,0);
    _DS(g,'L = 86 cm',0,tYY,wZ2+4);

    var dX2=W/2+_o;
    _DL(g,[[W/2,TY,-D/2],[dX2+4,tYY,-D/2]],1); _DL(g,[[W/2,TY,D/2],[dX2+4,tYY,D/2]],1);
    _DL(g,[[dX2+2,tYY,-D/2],[dX2+2,tYY,D/2]]);
    _DT(g,dX2+2,tYY,-D/2,0,0,1); _DT(g,dX2+2,tYY,D/2,0,0,1);
    _DS(g,'W = 40.5 cm',dX2+14,tYY,0);

    // ---> Funnel dimensions placed at _fTop <---
    var mZ = _fZd + 16; 
    _DL(g, [[_fX-_fMR, _fTop, _fZd+_fMR+1], [_fX-_fMR, _fTop, mZ]], 1);
    _DL(g, [[_fX+_fMR, _fTop, _fZd+_fMR+1], [_fX+_fMR, _fTop, mZ]], 1);
    _DL(g, [[_fX-_fMR, _fTop, mZ], [_fX+_fMR, _fTop, mZ]]);
    _DT(g, _fX-_fMR, _fTop, mZ, 0,0,1); _DT(g, _fX+_fMR, _fTop, mZ, 0,0,1);
    _DS(g, 'Mouth ∅ 13 cm', _fX, _fTop, mZ+4, 14);

    var tX_off = _fX - 16; 
    _DL(g, [[_fX-_fMR-1, _fTop, _fZd-_fTR], [tX_off, _fTop, _fZd-_fTR]], 1);
    _DL(g, [[_fX-_fMR-1, _fTop, _fZd+_fTR], [tX_off, _fTop, _fZd+_fTR]], 1);
    _DL(g, [[tX_off, _fTop, _fZd-_fTR], [tX_off, _fTop, _fZd+_fTR]]);
    _DT(g, tX_off, _fTop, _fZd-_fTR, 1,0,0); _DT(g, tX_off, _fTop, _fZd+_fTR, 1,0,0);
    _DS(g, 'Tube ∅ 6.5 cm', tX_off-8, _fTop, _fZd, 13);
  })(dimGroups.top);

  // ── BACK OPEN ──
  (function(g){
    var bkZ=-D/2;
    var bYt=BY+FT+3;
    _DL(g,[[-W/2+FT,BY+FT,bkZ],[-W/2+FT,bYt,bkZ]],1); _DL(g,[[D1X,BY+FT,bkZ],[D1X,bYt,bkZ]],1);
    _DL(g,[[D2X,BY+FT,bkZ],[D2X,bYt,bkZ]],1); _DL(g,[[W/2-FT,BY+FT,bkZ],[W/2-FT,bYt,bkZ]],1);
    _DL(g,[[-W/2+FT,bYt,bkZ],[D1X,bYt,bkZ]]); _DL(g,[[D1X,bYt,bkZ],[D2X,bYt,bkZ]]); _DL(g,[[D2X,bYt,bkZ],[W/2-FT,bYt,bkZ]]);
    _DT(g,-W/2+FT,bYt,bkZ,1,0,0); _DT(g,D1X,bYt,bkZ,1,0,0); _DT(g,D2X,bYt,bkZ,1,0,0); _DT(g,W/2-FT,bYt,bkZ,1,0,0);
    
    _DS(g,'B1W = 28.5',(-W/2+FT+D1X)/2,bYt-7,bkZ,13);
    _DS(g,'B2W = 29',0,bYt-15,bkZ,12); 
    _DS(g,'B3W = 28.5',(D2X+W/2-FT)/2,bYt-7,bkZ,13);

    [[B1X,tb13,1],[B2X,tb2,2],[B3X,tb13,3]].forEach(function(p){
      var cx=p[0], cby=p[1], ci=p[2];
      var dY3=cby+CH/2+3.5; 
      _DL(g,[[cx-CR,cby+CH/2,bkZ],[cx-CR,dY3,bkZ]],1);
      _DL(g,[[cx+CR,cby+CH/2,bkZ],[cx+CR,dY3,bkZ]],1);
      _DL(g,[[cx-CR,dY3,bkZ],[cx+CR,dY3,bkZ]]);
      _DT(g,cx-CR,dY3,bkZ,0,0,1,1.5); _DT(g,cx+CR,dY3,bkZ,0,0,1,1.5);
      _DS(g,'C'+ci+' ∅ 20 cm',cx,dY3+6,bkZ,13);
      
      var hX3=cx+CR+6; 
      _DL(g,[[cx+CR,cby-CH/2,bkZ],[hX3+2,cby-CH/2,bkZ]],1);
      _DL(g,[[cx+CR,cby+CH/2,bkZ],[hX3+2,cby+CH/2,bkZ]],1);
      _DL(g,[[hX3,cby-CH/2,bkZ],[hX3,cby+CH/2,bkZ]]);
      _DT(g,hX3,cby-CH/2,bkZ,0,1,0); _DT(g,hX3,cby+CH/2,bkZ,0,1,0);
      _DS(g,'CH = 20 cm',hX3+13,cby,bkZ,13);
    });
  })(dimGroups.backOpen);

  // ── FRONT OPEN ──
  (function(g){
    var fZ2 = D/2;

    var topY = TY + 18; 
    _DL(g,[[-W/2,TY,fZ2],[-W/2,topY,fZ2]],1); 
    _DL(g,[[W/2,TY,fZ2],[W/2,topY,fZ2]],1);
    _DL(g,[[-W/2,topY,fZ2],[W/2,topY,fZ2]]);
    _DT(g,-W/2,topY,fZ2,1,0,0); _DT(g,W/2,topY,fZ2,1,0,0);
    _DS(g,'Front W = 86 cm',0,topY+5,fZ2, 14);

    var hX = W/2+_o;
    _DL(g,[[W/2,BY,fZ2],[hX+4,BY,fZ2]],1); _DL(g,[[W/2,TY,fZ2],[hX+4,TY,fZ2]],1);
    _DL(g,[[hX+2,BY,fZ2],[hX+2,TY,fZ2]]);
    _DT(g,hX+2,BY,fZ2,0,1,0); _DT(g,hX+2,TY,fZ2,0,1,0);
    _DS(g,'Front H = 51 cm',hX+14,0,fZ2, 14);

    var tY = BY + FT; 
    var tZb = FZ; 
    var tZf = FZ + DH; 
    var tXl = -W/2 + FT, tXr = W/2 - FT;

    var zLine = tZf + 10; 
    _DL(g, [[tXl, tY, tZf], [tXl, tY, zLine+1]], 1);
    _DL(g, [[tXr, tY, tZf], [tXr, tY, zLine+1]], 1);
    _DL(g, [[tXl, tY, zLine], [tXr, tY, zLine]]);
    _DT(g, tXl, tY, zLine, 1,0,0); _DT(g, tXr, tY, zLine, 1,0,0);
    _DS(g, 'Tray L = 81 cm', 0, tY+6, zLine+4, 14);

    var xLine = tXr + 10; 
    _DL(g, [[tXr, tY, tZb], [xLine+1, tY, tZb]], 1);
    _DL(g, [[tXr, tY, tZf], [xLine+1, tY, tZf]], 1);
    _DL(g, [[xLine, tY, tZb], [xLine, tY, tZf]]);
    _DT(g, xLine, tY, tZb, 0,0,1); _DT(g, xLine, tY, tZf, 0,0,1);
    _DS(g, 'Tray W = 33.5 cm', xLine+14, tY+6, (tZb+tZf)/2, 16);

  })(dimGroups.frontOpen);

  // ── DEMO ANIMATION ──
  var demoPlaying=false, demoT=0, demoPhase=-1;

  function _demoSetDoors(f,b,c,p){
    st.f=f; st.b=b; st.c=c; st.p=p;
    document.getElementById('bF').textContent ='🚪 Front: '   +(f?'Open':'Closed');
    document.getElementById('bB').textContent ='🚪 Back: '    +(b?'Open':'Closed');
    document.getElementById('bC').textContent ='📟 Circuit: ' +(c?'Open':'Closed');
    document.getElementById('bP').textContent ='📦 Platform: '+(p?'Open':'Folded');
    ['bF','bB','bC','bP'].forEach(function(id){
      var s=id==='bF'?f:id==='bB'?b:id==='bC'?c:p;
      document.getElementById(id).classList.toggle('on',s);
    });
    _dimUpdate();
  }

  window.toggleDemo=function(){
    demoPlaying=!demoPlaying; demoT=0; demoPhase=-1;
    var btn=document.getElementById('bDemo');
    btn.textContent=demoPlaying?'⏹ Stop':'▶ Demo';
    btn.classList.toggle('on',demoPlaying);
    if(!demoPlaying){
      _demoSetDoors(false,false,false,false);
      tX=0.25; tY=-0.5; tZ=1;
    }
  };

  // ── CAMERA CONTROLS ──
  var rX=0.25,rY=-0.5,tX=0.25,tY=-0.5,zm=1,tZ=1;
  var drag=false,ox=0,oy=0;
  var st={f:false,b:false,c:false,p:false};
  var vm={iso:[0.25,-0.5],front:[0.04,0],back:[0.04,Math.PI],
    left:[0.04,-Math.PI/2],right:[0.04,Math.PI/2],top:[1.45,0]};

  window.sv=function(v,btn){
    dimCurView=v;
    tX=vm[v][0]; tY=vm[v][1]; tZ=1;
    document.querySelectorAll('.b').forEach(function(b){b.classList.remove('on');});
    if(btn) btn.classList.add('on');
    _dimUpdate();
  };
  window.tg=function(k){
    st[k]=!st[k];
    var lb={f:'🚪 Front:',b:'🚪 Back:',c:'📟 Circuit:',p:'📦 Platform:'};
    var id={f:'bF',b:'bB',c:'bC',p:'bP'};
    document.getElementById(id[k]).textContent=lb[k]+' '+(st[k]?'Open':'Closed');
    document.getElementById(id[k]).classList.toggle('on',st[k]);
    if(k==='f'||k==='b') _dimUpdate(); 
  };

  window.tgShadow=function(btn){
    sun.castShadow=!sun.castShadow;
    btn.textContent='🌑 Shadow: '+(sun.castShadow?'On':'Off');
    btn.classList.toggle('on',sun.castShadow);
  };

  window.tgDim=function(btn){
    dimOn=!dimOn;
    btn.textContent='📐 Dims: '+(dimOn?'On':'Off');
    btn.classList.toggle('on',dimOn);
    _dimUpdate();
  };

  function _dimUpdate(){
    Object.keys(dimGroups).forEach(function(k){ dimGroups[k].visible=false; });
    if(!dimOn) return;
    var key=dimCurView;
    if(key==='back'  && st.b) key='backOpen';
    if(key==='front' && st.f) key='frontOpen';
    if(dimGroups[key]) dimGroups[key].visible=true;
  }

  cv.addEventListener('mousedown',function(e){drag=true;ox=e.clientX;oy=e.clientY;cv.style.cursor='grabbing';});
  window.addEventListener('mouseup',function(){drag=false;cv.style.cursor='grab';});
  cv.addEventListener('mousemove',function(e){
    if(!drag)return;
    tY+=(e.clientX-ox)*0.007; tX+=(e.clientY-oy)*0.007;
    tX=Math.max(-1.45,Math.min(1.45,tX));
    ox=e.clientX; oy=e.clientY;
  });
  cv.addEventListener('wheel',function(e){
    tZ*=e.deltaY>0?1.12:0.89;
    tZ=Math.max(0.32,Math.min(3.5,tZ));
    e.preventDefault();
  },{passive:false});
  var lt=null,lpd=null;
  cv.addEventListener('touchstart',function(e){
    lt=e.touches[0];
    lpd=e.touches.length>1?Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY):null;
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&lpd){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
      tZ*=lpd/d; tZ=Math.max(0.32,Math.min(3.5,tZ)); lpd=d;
    }else if(lt){
      tY+=(e.touches[0].clientX-lt.clientX)*0.009;
      tX+=(e.touches[0].clientY-lt.clientY)*0.009;
      tX=Math.max(-1.45,Math.min(1.45,tX));
      lt=e.touches[0];
    }
    e.preventDefault();
  },{passive:false});

(function loop(){
    requestAnimationFrame(loop);

    if(demoPlaying){
      demoT+=1/60;
  var ph=
          demoT<1.5  ? 0 :   // front view — open front door + platforms
          demoT<3.0  ? 1 :   // swing to left side
          demoT<4.5  ? 2 :   // swing to back — open back + circuit
          demoT<6.0  ? 3 :   // swing to right side
          demoT<7.5  ? 4 :   // close all, back to front
          demoT<10.0 ? 5 :   // full 360 spin
          demoT<11.5 ? 6 :   // return to iso
                      7;    // done
        if(ph!==demoPhase){
          demoPhase=ph;
          if(ph===0){ tX=0.04; tY=0;           tZ=1.0;  _demoSetDoors(true,false,false,true); }
          if(ph===1){ tX=0.04; tY=-Math.PI/2;  tZ=1.0;  _demoSetDoors(false,false,false,false); }
          if(ph===2){ tX=0.04; tY=-Math.PI;    tZ=1.0;  _demoSetDoors(false,true,true,false); }
          if(ph===3){ tX=0.04; tY=Math.PI/2;   tZ=1.0;  _demoSetDoors(false,false,false,false); }
          if(ph===4){ tX=0.04; tY=0;           tZ=1.0;  _demoSetDoors(false,false,false,false); }
          if(ph===5){ tX=0.20; tZ=1.15; }
          if(ph===6){ tX=0.04; tY=0;            tZ=1.0;  _demoSetDoors(false,false,false,false); }
          if(ph===7){ demoPlaying=false; demoPhase=-1;
            document.getElementById('bDemo').textContent='▶ Demo';
            document.getElementById('bDemo').classList.remove('on'); }
        }
      var spinStart=7.5;
              if(ph===5) tY=0-(((demoT-spinStart)/2.5)*Math.PI*2);
          }

    rX+=(tX-rX)*0.1; rY+=(tY-rY)*0.1; zm+=(tZ-zm)*0.1;
    fDG.rotation.x +=((st.f?Math.PI/2:0)-fDG.rotation.x)*0.12;
    bDLG.rotation.y+=((st.b?Math.PI/2:0)-bDLG.rotation.y)*0.12;
    bDRG.rotation.y+=((-st.b*Math.PI/2)-bDRG.rotation.y)*0.12;
    cbG.rotation.x +=((-st.c*Math.PI/2)-cbG.rotation.x)*0.12;
    platLG.rotation.z+=((st.p?0:-Math.PI/2)-platLG.rotation.z)*0.12;
    platRG.rotation.z+=((st.p?0: Math.PI/2)-platRG.rotation.z)*0.12;

    var ang=fDG.rotation.x;
    if(ang>0.06){
      var wY=fHY+cDoorY*Math.cos(ang);
      var wZ=FZ +cDoorY*Math.sin(ang);
      updateChain(chainL,-cAncX,cFrmY,FZ,-cAncX,wY,wZ);
      updateChain(chainR, cAncX,cFrmY,FZ, cAncX,wY,wZ);
    } else {
      chainL.visible=false; chainR.visible=false;
    }
    root.rotation.x=rX; root.rotation.y=rY;
    var d=190*zm;
    cam.position.set(0,d*0.34,d);
    cam.lookAt(0,5,0);
    ren.render(scene,cam);
  })();
}
</script>
</body>
</html>
